image:
  api:
    repository: containers.catalystsquad.com/public/catalystcommunity/longhouse-api
  web:
    repository: containers.catalystsquad.com/public/catalystcommunity/longhouse-web

# Use the existing ephemeral squizzlezig Linkkeys server as the IDP and RP.
linkkeysRp:
  enabled: false
  transport: "tcp"
  url: "https://linkkeys.squizzlezig.com"
  tcpAddr: "linkkeys-squizzlezig.linkkeys-squizzlezig.svc.cluster.local:4987"
  tcpAllowInsecure: false
  tcpFingerprints: "cf7c3e009cd8dce388159203e7c3f544dc30688b37d4c515b7fa6fa35dee7b96,33638deca938b21a54e672b329713366a31853db11d74bb566b62f154451664a,d03fe7d96b7be18b0394475968880dbd9b4e94689dbea67bc38a4fd29ea5fc5d"

database:
  url: ""

postgresql:
  enabled: true
  teamId: longhouse-squizzlezig
  database: longhouse_db
  user: longhouse
  instances: 1
  storage:
    size: 1Gi

server:
  env: "nonprod"
  linkkeysDomain: "squizzlezig.com"
  initialAdmin:
    domain: "squizzlezig.com"
    userId: "01a083dc-b31f-7c53-a689-56ea92268809"
  initialHouseName: "Squizzlezig Dev"
  linkkeysIdpUrl: "https://linkkeys.squizzlezig.com"
  linkkeysIdpDomain: "squizzlezig.com"
  appCallbackUrl: "https://longhouse.squizzlezig.com/auth/callback"
  bearerTTLSeconds: 43200
  refreshTokenTTLSeconds: 2592000

gateway:
  httpRoute:
    api:
      enabled: true
      parentGateway: contour
      parentNamespace: projectcontour
      parentSection: http
      hostnames:
        - longhouse-api.squizzlezig.com
        - longhouse.squizzlezig.com
      pathPrefixes:
        - /api
    web:
      enabled: true
      parentGateway: contour
      parentNamespace: projectcontour
      parentSection: http
      hostnames:
        - longhouse.squizzlezig.com

# Optional calendar service. Keys are enrolled under the Longhouse dev RP.
catalystcal:
  enabled: true
  url: "https://catalystcal.squizzlezig.com"
  callbackUrl: "https://longhouse.squizzlezig.com/calendar"
  existingSecret: "longhouse-calendar"
  keysKey: "keys.json"
  homeTcpAddr: "linkkeys-squizzlezig.linkkeys-squizzlezig.svc.cluster.local:4987"
  homeFingerprints: "cf7c3e009cd8dce388159203e7c3f544dc30688b37d4c515b7fa6fa35dee7b96,33638deca938b21a54e672b329713366a31853db11d74bb566b62f154451664a,d03fe7d96b7be18b0394475968880dbd9b4e94689dbea67bc38a4fd29ea5fc5d"
