apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "longhouse.fullname" . }}-api
  labels:
    {{- include "longhouse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount.api }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "longhouse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- if .Values.actAs.enabled }}
        {{- $actAsSecret := lookup "v1" "Secret" .Release.Namespace .Values.actAs.existingSecret }}
        checksum/act-as-keys: {{ (($actAsSecret | default dict).data | default dict) | toJson | sha256sum }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "longhouse.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "longhouse.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          args: ["serve"]
          {{- if or .Values.catalystcal.enabled .Values.actAs.enabled }}
          volumeMounts:
            {{- if .Values.actAs.enabled }}
            - name: act-as-keys
              mountPath: /var/run/longhouse-act-as
              readOnly: true
            {{- end }}
            {{- if .Values.catalystcal.enabled }}
            - name: calendar-keys
              mountPath: /var/run/longhouse-calendar
              readOnly: true
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.apiPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "longhouse.fullname" . }}
            - secretRef:
                name: {{ include "longhouse.fullname" . }}
          {{- if .Values.postgresql.enabled }}
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.user | default "longhouse" }}.{{ include "longhouse.fullname" . }}-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.user | default "longhouse" }}.{{ include "longhouse.fullname" . }}-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            - name: LONGHOUSE_DB_URI
              value: "postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "longhouse.fullname" . }}-postgres:5432/{{ .Values.postgresql.database | default "longhouse_db" }}?sslmode=require"
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.catalystcal.enabled .Values.actAs.enabled }}
      volumes:
        {{- if .Values.actAs.enabled }}
        - name: act-as-keys
          secret:
            secretName: {{ required "actAs.existingSecret is required" .Values.actAs.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.actAs.keysKey }}
                path: keys.json
        {{- end }}
        {{- if .Values.catalystcal.enabled }}
        - name: calendar-keys
          secret:
            secretName: {{ required "catalystcal.existingSecret is required" .Values.catalystcal.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.catalystcal.keysKey }}
                path: keys.json
        {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
