name: longhouse-deploy
description: "Deploy longhouse to Kubernetes via Helm. Use with an overlay to set namespace, release name, values, and secrets."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 600
  priority: 5
  working_dir: /job
environment:
  REACTORCIDE_LONGHOUSE_JOB: deploy
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
  KUBECONFIG_CONTENT: "${secret:catalystcommunity/k8s:kubeconfig}"
  # These must be set via overlay:
  K8S_NAMESPACE: ""
  HELM_RELEASE: ""
  HELM_VALUES_FILE: ""
  # IMAGE_TAG defaults to whatever version/VERSION.txt currently has.
  # Set it explicitly via overlay if you want to pin a deploy to a
  # specific tag instead of tracking the working tree.
