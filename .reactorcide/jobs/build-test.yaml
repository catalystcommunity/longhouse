name: longhouse-build-test
description: "Build and test the Go API module"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 600
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_LONGHOUSE_JOB: build-test
run_local:
  user: host
