name: longhouse-api-build-test
description: "Verify the API Docker image builds successfully on PR"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 600
  working_dir: /job
  capabilities:
    - builder
environment:
  REACTORCIDE_LONGHOUSE_JOB: api-build-test
run_local:
  user: host
