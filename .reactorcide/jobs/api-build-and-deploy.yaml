name: longhouse-api-build-and-deploy
description: "Build API Docker image and push to registries"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1200
  priority: 15
  working_dir: /job
  capabilities:
    - builder
environment:
  REACTORCIDE_LONGHOUSE_JOB: api-build-and-deploy
  REGISTRY_INTERNAL: "containers.catalystsquad.com"
  REGISTRY_INTERNAL_PATH: "public/catalystcommunity/longhouse-api"
  REGISTRY_EXTERNAL: "containers.catalystsquad.com"
  REGISTRY_EXTERNAL_PATH: "public/catalystcommunity/longhouse-api"
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
