name: longhouse-api-test-postgres
description: "Run api module tests against a real PostgreSQL (inline)"
triggers:
  events:
    - pull_request_opened
    - pull_request_updated
  branches:
    - main
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
  depends_on:
    - longhouse-conventional-commits
environment:
  REACTORCIDE_LONGHOUSE_JOB: api-test-postgres
run_local:
  user: host
