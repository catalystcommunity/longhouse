name: longhouse-web-build-test
description: "Verify the web UI Docker image builds successfully on PR"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 600
  working_dir: /job
  capabilities:
    - builder
environment:
  REACTORCIDE_LONGHOUSE_JOB: web-build-test
run_local:
  user: host
