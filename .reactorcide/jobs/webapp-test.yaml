name: longhouse-webapp-test
description: "Type-check + unit-test the SolidJS SPA in webapp/ (vitest + tsc)"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 900
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_LONGHOUSE_JOB: webapp-test
run_local:
  user: host
