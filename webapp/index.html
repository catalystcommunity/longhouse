<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Longhouse</title>

<!-- PWA: "Add to Home Screen" launches standalone (no browser chrome).
     No service worker; the manifest + metas are enough for that. Theme
     colors match --surface in styles/tokens.css (light + dark). -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#e8ece1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1814" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Longhouse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">

<script>
  // Pre-paint theme + scene init to avoid FOUC.
  // Keys match what the Solid store reads/writes.
  (function () {
    try {
      var t = localStorage.getItem("longhouse.theme")
           || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
      var s = localStorage.getItem("longhouse.scene");
      // default scene = on
      document.documentElement.setAttribute("data-scene", s === "off" ? "off" : "on");
    } catch (_) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
